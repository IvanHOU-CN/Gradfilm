<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Graduation</title>
<meta name="description" content="A little graduation card for you.">
<meta property="og:title" content="A little card for you">
<meta property="og:description" content="Happy graduation!">
<meta name="theme-color" content="#151a46">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='88'>🎓</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shantell+Sans:wght@400;600;700&display=swap" rel="stylesheet">

<script>
/* =====================================================================
   EDIT YOUR CARD HERE
   - {name} is replaced by the friend's name. Names come from names.js
     (matched to the card code in the link, e.g. .../?c=k7m2),
     or straight from the link, e.g. .../?to=Anna
   - With no name, greetingNoName is used instead.
   ===================================================================== */
window.CARD = {
  from: "Ivan",
  classOf: "2026",
  greeting: "Happy graduation, {name}!",
  greetingNoName: "Happy graduation!",
  caption1: "From here, we all fly off in different directions…",
  caption2: "…but we'll always share the same sky.",
  note: "So glad our paths crossed here."
};
</script>
<script src="names.js"></script>

<style>
  :root {
    --ink: #0e1236;
    --starlight: #ffe7a3;
    --paper: #fff3dc;
    --font: "Shantell Sans", "Chalkboard SE", "Marker Felt", "Comic Neue", system-ui, sans-serif;
  }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--ink);
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
  }
  body { font-family: var(--font); color: var(--paper); }
  button { font: inherit; touch-action: manipulation; }
  button:focus-visible { outline: 2px solid var(--starlight); outline-offset: 3px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* The frame is the phone-shaped window; on a laptop it becomes a centred column. */
  .frame {
    position: fixed;
    top: 0; bottom: 0; left: 50%;
    width: min(100vw, 70vh);
    width: min(100vw, 70dvh);
    transform: translateX(-50%);
    overflow: hidden;
    background: #6e5aa8;
  }
  /* The stage is a fixed 400 x 700 drawing, scaled to cover the frame. */
  .stage {
    position: absolute;
    left: 50%; top: 50%;
    width: 400px; height: 700px;
    transform: translate(-50%, -50%);
  }
  .stage svg { display: block; width: 400px; height: 700px; }

  /* ---------- words that sit in the sky ---------- */
  .words { position: absolute; inset: 0; pointer-events: none; text-align: center; }
  .words p, .words h1 { margin: 0; }
  .captions { position: absolute; top: 262px; left: 44px; right: 44px; }
  .caption {
    font-size: 19px; line-height: 1.35; font-weight: 600;
    color: var(--paper);
    text-shadow: 0 1px 2px rgba(10, 12, 40, .55), 0 0 18px rgba(10, 12, 40, .45);
    opacity: 0;
  }
  .caption + .caption { margin-top: 6px; }
  .final { position: absolute; top: 250px; left: 30px; right: 30px; }
  .greet {
    font-size: 28px; line-height: 1.2; font-weight: 700;
    color: var(--starlight);
    text-shadow: 0 1px 2px rgba(10, 12, 40, .6), 0 0 22px rgba(255, 210, 120, .35);
    opacity: 0;
  }
  .note {
    margin-top: 10px !important;
    font-size: 18px; line-height: 1.4; font-weight: 400;
    text-shadow: 0 1px 2px rgba(10, 12, 40, .6);
    opacity: 0;
  }
  .sign {
    margin-top: 6px !important;
    font-size: 20px; font-weight: 600;
    text-shadow: 0 1px 2px rgba(10, 12, 40, .6);
    opacity: 0;
  }
  .again {
    margin-top: 18px;
    display: inline-flex; align-items: center; gap: 7px;
    padding: 8px 18px 8px 14px;
    font-size: 16px; font-weight: 600;
    color: var(--starlight);
    background: rgba(14, 18, 54, .72);
    border: 1.5px solid rgba(255, 231, 163, .65);
    border-radius: 999px;
    pointer-events: auto; cursor: pointer;
    opacity: 0; visibility: hidden;
  }
  .again svg { width: 16px; height: 16px; }

  /* ---------- sound toggle ---------- */
  .sound {
    position: absolute;
    top: calc(env(safe-area-inset-top, 0px) + 12px);
    right: 12px;
    width: 40px; height: 40px;
    display: grid; place-items: center;
    padding: 0;
    color: var(--paper);
    background: rgba(14, 18, 54, .35);
    border: 1px solid rgba(255, 243, 220, .35);
    border-radius: 50%;
    cursor: pointer;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  .sound[hidden] { display: none; }
  .sound svg { width: 20px; height: 20px; }
  .sound .off { display: none; }
  .sound[aria-pressed="false"] .on { display: none; }
  .sound[aria-pressed="false"] .off { display: block; }

  /* ---------- envelope intro ---------- */
  .intro {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px;
    padding: 24px 16px calc(env(safe-area-inset-bottom, 0px) + 24px);
    background:
      radial-gradient(circle at 50% 45%, rgba(255, 214, 160, .18), transparent 60%),
      rgba(38, 24, 70, .5);
    text-align: center;
  }
  .intro[hidden] { display: none; }
  .for { margin: 0; font-size: 30px; font-weight: 700; color: var(--paper); text-shadow: 0 2px 10px rgba(20, 10, 40, .5); }
  .envelope { margin-top: -24px; padding: 0; border: 0; background: none; cursor: pointer; border-radius: 12px; }
  .envelope svg { display: block; width: min(72vw, 270px); height: auto; overflow: visible; filter: drop-shadow(0 10px 18px rgba(20, 10, 40, .35)); }
  .hint { margin: 0; font-size: 18px; font-weight: 600; }
  .hint small { display: block; margin-top: 4px; font-size: 14px; font-weight: 400; opacity: .8; }
  .seal-pulse { animation: pulse 1.8s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }

  .intro.opening .seal-pulse { animation: sealPop .22s ease-in forwards; }
  .intro.opening .flap-front { animation: flapShut .16s .1s ease-in forwards; }
  .intro.opening .flap-back { animation: flapOpen .18s .26s ease-out forwards; }
  .intro.opening .letter { animation: letterUp .4s .32s cubic-bezier(.3, 1.4, .5, 1) forwards; }
  .intro.opening { animation: introOut .4s .55s ease-in forwards; pointer-events: none; }
  .flap-back { transform: scaleY(0); }
  @keyframes sealPop { to { transform: scale(1.5); opacity: 0; } }
  @keyframes flapShut { to { transform: scaleY(0); } }
  @keyframes flapOpen { from { transform: scaleY(0); } to { transform: scaleY(-1); } }
  @keyframes letterUp { to { transform: translateY(-50px); } }
  @keyframes introOut { to { opacity: 0; transform: scale(1.05); } }

  /* ---------- scene: resting state before it plays ---------- */
  .night, .moon, .bgs, .win { opacity: 0; }
  .sil { fill: #5b4886; }
  .tree { fill: #4a3a76; }
  .river { fill: #e7a3a6; }
  .streak { stroke: #ffe3c8; }
  .lawn { fill: #94c78b; }
  .lawn2 { fill: #80b87c; }
  .tuft-grass { stroke: #6da56b; }
  .pop, .cshadow { transform: scale(0); }
  .arm-l { transform: rotate(35deg); }
  .arm-r { transform: rotate(-35deg); }
  .eyes-happy, .mouth-open { opacity: 0; }
  .star { transform: scale(0); opacity: 0; }
  .burst { opacity: 0; }
  .shoot { opacity: 0; }

  /* ---------- scene: timeline (seconds after the card opens) ---------- */
  .go .night { animation: fadeIn 3s 2.8s ease-in-out both; }
  .go .sun { animation: sunDown 2.9s 2.4s ease-in both; }
  .go .sil { animation: silNight 3s 2.8s ease-in-out both; }
  .go .tree { animation: treeNight 3s 2.8s ease-in-out both; }
  .go .river { animation: riverNight 3s 2.8s ease-in-out both; }
  .go .streak { animation: streakNight 3s 2.8s ease-in-out both, shimmer 3.2s ease-in-out infinite; }
  .go .lawn { animation: lawnNight 3s 2.8s ease-in-out both; }
  .go .lawn2 { animation: lawn2Night 3s 2.8s ease-in-out both; }
  .go .tuft-grass { animation: tuftNight 3s 2.8s ease-in-out both; }
  .go .punt { animation: drift 14s linear both; }
  .go .moon { animation: fadeIn 2s 4.4s ease-out both; }
  .go .win { animation: winOn 1.2s calc(4.4s + var(--d)) ease-out both; }
  .go .bgs { animation: fadeIn 1.4s calc(4.2s + var(--d)) ease-out both, twinkle var(--p) calc(6.2s + var(--d)) ease-in-out infinite; }
  .go .shoot { animation: shoot 1s 7.9s ease-in both; }

  .go .pop { animation: pop .5s calc(.25s + var(--i) * .22s) cubic-bezier(.3, 1.7, .5, 1) both; }
  .go .cshadow { animation: pop .5s calc(.25s + var(--i) * .22s) ease-out both, shadowJump 1.3s 2.3s forwards; }
  .go .jump { animation: jump 1.3s 2.3s both; }
  .go .arm-l { animation: armL 6.9s 2.3s both; }
  .go .arm-r { animation: armR 6.9s 2.3s both; }
  .go .arm-l.outer { animation-name: armLOuter; }
  .go .arm-r.outer { animation-name: armROuter; }
  .go .arm-l.outer .wave { animation: waveL 1.1s 9.25s ease-in-out infinite; }
  .go .arm-r.outer .wave { animation: waveR 1.1s 9.25s ease-in-out infinite; }
  .go .sway { animation: sway 2.6s 9.3s ease-in-out infinite; }
  .go .eyes { animation: lookUp 6.4s 2.9s both; }
  .go .eyes-open { animation: fadeOut .2s 9.1s both; }
  .go .eyes-happy { animation: fadeIn .2s 9.1s both; }
  .go .mouth-open { animation: openMouth 1.7s 2.55s both; }
  .go .mouth-smile { animation: closeMouth 1.7s 2.55s both; }
  .go .cap-dip { animation: capDip .3s 2.3s ease-in-out both; }

  .go .c1 { animation: textIn .8s 4.6s ease-out both, fadeOut .5s 9s ease-in forwards; }
  .go .c2 { animation: textIn .8s 6.7s ease-out both, fadeOut .5s 9s ease-in forwards; }
  .go .greet { animation: textIn .9s 9.3s ease-out both; }
  .go .note { animation: textIn .9s 9.75s ease-out both; }
  .go .sign { animation: textIn .9s 10.2s ease-out both; }
  .go .again { animation: btnIn .6s 10.8s ease-out both; }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
  @keyframes winOn { from { opacity: 0; } to { opacity: .72; } }
  @keyframes twinkle { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
  @keyframes sunDown { to { transform: translateY(84px); } }
  @keyframes silNight { from { fill: #5b4886; } to { fill: #151a43; } }
  @keyframes treeNight { from { fill: #4a3a76; } to { fill: #0f1539; } }
  @keyframes riverNight { from { fill: #e7a3a6; } to { fill: #252d6b; } }
  @keyframes streakNight { from { stroke: #ffe3c8; } to { stroke: #7b82d2; } }
  @keyframes shimmer { 0%, 100% { transform: translateX(-3px); } 50% { transform: translateX(3px); } }
  @keyframes lawnNight { from { fill: #94c78b; } to { fill: #2a584f; } }
  @keyframes lawn2Night { from { fill: #80b87c; } to { fill: #224841; } }
  @keyframes tuftNight { from { stroke: #6da56b; } to { stroke: #1d3f38; } }
  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(110px); } }
  @keyframes shoot {
    0% { transform: translateX(0); opacity: 0; }
    15% { opacity: 1; }
    100% { transform: translateX(240px); opacity: 0; }
  }
  @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
  @keyframes jump {
    0% { transform: translateY(0) scale(1, 1); animation-timing-function: ease-in-out; }
    23% { transform: translateY(0) scale(1.08, .88); animation-timing-function: cubic-bezier(.2, .8, .4, 1); }
    42% { transform: translateY(-28px) scale(.95, 1.08); animation-timing-function: cubic-bezier(.6, 0, .9, .5); }
    62% { transform: translateY(0) scale(1.07, .91); animation-timing-function: ease-out; }
    78% { transform: translateY(-3px) scale(.99, 1.02); animation-timing-function: ease-in-out; }
    100% { transform: translateY(0) scale(1, 1); }
  }
  @keyframes shadowJump {
    0% { transform: scale(1); }
    23% { transform: scale(1.1, 1); }
    42% { transform: scale(.62); }
    62% { transform: scale(1.12, 1); }
    100% { transform: scale(1); }
  }
  @keyframes armL {
    0% { transform: rotate(35deg); }
    4.3% { transform: rotate(48deg); animation-timing-function: cubic-bezier(.2, .9, .3, 1); }
    9.4% { transform: rotate(155deg); }
    14.5% { transform: rotate(148deg); animation-timing-function: ease-in-out; }
    20% { transform: rotate(35deg); }
    91% { transform: rotate(35deg); animation-timing-function: ease-in-out; }
    98% { transform: rotate(84deg); }
    100% { transform: rotate(80deg); }
  }
  @keyframes armR {
    0% { transform: rotate(-35deg); }
    4.3% { transform: rotate(-48deg); animation-timing-function: cubic-bezier(.2, .9, .3, 1); }
    9.4% { transform: rotate(-155deg); }
    14.5% { transform: rotate(-148deg); animation-timing-function: ease-in-out; }
    20% { transform: rotate(-35deg); }
    91% { transform: rotate(-35deg); animation-timing-function: ease-in-out; }
    98% { transform: rotate(-84deg); }
    100% { transform: rotate(-80deg); }
  }
  @keyframes armLOuter {
    0% { transform: rotate(35deg); }
    4.3% { transform: rotate(48deg); animation-timing-function: cubic-bezier(.2, .9, .3, 1); }
    9.4% { transform: rotate(155deg); }
    14.5% { transform: rotate(148deg); animation-timing-function: ease-in-out; }
    20% { transform: rotate(35deg); }
    91% { transform: rotate(35deg); animation-timing-function: ease-in-out; }
    98% { transform: rotate(150deg); }
    100% { transform: rotate(140deg); }
  }
  @keyframes armROuter {
    0% { transform: rotate(-35deg); }
    4.3% { transform: rotate(-48deg); animation-timing-function: cubic-bezier(.2, .9, .3, 1); }
    9.4% { transform: rotate(-155deg); }
    14.5% { transform: rotate(-148deg); animation-timing-function: ease-in-out; }
    20% { transform: rotate(-35deg); }
    91% { transform: rotate(-35deg); animation-timing-function: ease-in-out; }
    98% { transform: rotate(-150deg); }
    100% { transform: rotate(-140deg); }
  }
  @keyframes waveL { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-24deg); } }
  @keyframes waveR { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(24deg); } }
  @keyframes sway { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-3.5deg); } 75% { transform: rotate(3.5deg); } }
  @keyframes lookUp {
    0% { transform: translateY(0); }
    6% { transform: translateY(-3.2px); }
    86% { transform: translateY(-3.2px); }
    92% { transform: translateY(0); }
    100% { transform: translateY(0); }
  }
  @keyframes openMouth { 0% { opacity: 0; } 6% { opacity: 1; } 94% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes closeMouth { 0% { opacity: 1; } 6% { opacity: 0; } 94% { opacity: 0; } 100% { opacity: 1; } }
  @keyframes capDip { to { transform: translateY(7px); } }
  @keyframes starPop { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes starTwinkle { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.14); } }
  @keyframes burst { 0% { transform: scale(.4); opacity: 0; } 20% { opacity: 1; } 100% { transform: scale(1.7); opacity: 0; } }
  @keyframes textIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes btnIn { from { opacity: 0; visibility: hidden; } to { opacity: 1; visibility: visible; } }

  /* People who ask their phone for less motion get the finished scene straight away. */
  @media (prefers-reduced-motion: reduce) {
    .go *, .intro.opening, .intro.opening * {
      animation-delay: 0s !important;
      animation-duration: .01s !important;
      animation-iteration-count: 1 !important;
    }
  }
</style>
</head>
<body>
<div class="frame" id="frame">
  <div class="stage" id="stage">
    <svg id="scene" viewBox="0 0 400 700" aria-hidden="true">
      <defs>
        <linearGradient id="gSunset" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#6e5aa8"/>
          <stop offset=".45" stop-color="#c47cae"/>
          <stop offset=".78" stop-color="#f6a48e"/>
          <stop offset="1" stop-color="#ffd49b"/>
        </linearGradient>
        <linearGradient id="gNight" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#0d1236"/>
          <stop offset=".55" stop-color="#1c2360"/>
          <stop offset="1" stop-color="#3b3f88"/>
        </linearGradient>
        <radialGradient id="gSunGlow">
          <stop offset="0" stop-color="#ffe3a6" stop-opacity=".9"/>
          <stop offset="1" stop-color="#ffd08a" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="gMoonGlow">
          <stop offset="0" stop-color="#fff0c2" stop-opacity=".35"/>
          <stop offset="1" stop-color="#fff0c2" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="gTail" gradientUnits="userSpaceOnUse" x1="-46" y1="0" x2="0" y2="0">
          <stop offset="0" stop-color="#fff" stop-opacity="0"/>
          <stop offset="1" stop-color="#fff" stop-opacity=".95"/>
        </linearGradient>
        <mask id="moonMask">
          <rect x="-30" y="-30" width="60" height="60" fill="#fff"/>
          <circle cx="7" cy="-5" r="13" fill="#000"/>
        </mask>
        <clipPath id="bodyClip">
          <path d="M-25,0 C-27.5,-30 -20,-58 0,-58 C20,-58 27.5,-30 25,0 Q0,3 -25,0 Z"/>
        </clipPath>
      </defs>

      <!-- sky -->
      <rect width="400" height="484" fill="url(#gSunset)"/>
      <rect class="night" width="400" height="484" fill="url(#gNight)"/>
      <g id="bgStars"></g>

      <g transform="translate(66,104)">
        <g class="moon">
          <circle r="34" fill="url(#gMoonGlow)"/>
          <circle r="15" fill="#fff0c2" mask="url(#moonMask)"/>
        </g>
      </g>

      <g transform="translate(26,44) rotate(17)">
        <g class="shoot">
          <line x1="-46" y1="0" x2="0" y2="0" stroke="url(#gTail)" stroke-width="2" stroke-linecap="round"/>
          <circle r="1.8" fill="#fff"/>
        </g>
      </g>

      <g class="sun">
        <circle cx="320" cy="452" r="48" fill="url(#gSunGlow)"/>
        <circle cx="320" cy="452" r="25" fill="#ffe8b0"/>
      </g>

      <!-- the friends' constellation -->
      <path id="lines" class="lines" fill="none" stroke="#ffe7a3" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" opacity=".8"/>
      <g id="stars"></g>

      <!-- a Cambridge-ish skyline: a chapel with pinnacles, a college building, trees -->
      <g id="skyline">
        <circle class="tree" cx="36" cy="462" r="16"/>
        <circle class="tree" cx="60" cy="451" r="21"/>
        <circle class="tree" cx="86" cy="446" r="22"/>
        <circle class="tree" cx="104" cy="460" r="15"/>
        <circle class="tree" cx="362" cy="455" r="18"/>
        <circle class="tree" cx="386" cy="462" r="16"/>
        <g id="chapel"></g>
      </g>

      <!-- the river and a punt -->
      <rect class="river" y="474" width="400" height="40"/>
      <g stroke-linecap="round" stroke-width="1.6" opacity=".7">
        <line class="streak" x1="40" y1="481" x2="70" y2="481"/>
        <line class="streak" x1="196" y1="484" x2="236" y2="484"/>
        <line class="streak" x1="300" y1="480" x2="320" y2="480"/>
        <line class="streak" x1="120" y1="492" x2="150" y2="492"/>
        <line class="streak" x1="258" y1="495" x2="296" y2="495"/>
      </g>
      <g transform="translate(34,490)">
        <g class="punt">
          <path class="sil" d="M-20,-2 L20,-2 L17,2 L-17,2 Z"/>
          <path class="sil" d="M10,-2 C9,-10 11,-15 14,-15 C17,-15 19,-10 18,-2 Z"/>
          <circle class="sil" cx="14" cy="-17.5" r="3"/>
          <path class="sil" d="M-12,-2 C-12,-8 -4,-8 -4,-2 Z"/>
          <circle class="sil" cx="-8" cy="-9.8" r="2.6"/>
          <line x1="17" y1="-13" x2="25" y2="6" stroke="#3a2f5e" stroke-width="1.2" stroke-linecap="round" opacity=".9"/>
        </g>
      </g>

      <!-- the lawn -->
      <path class="lawn" d="M0,508 C70,499 140,495 200,497 C270,499 340,503 400,511 L400,700 L0,700 Z"/>
      <path class="lawn2" d="M0,646 C120,634 280,636 400,648 L400,700 L0,700 Z"/>
      <g fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path class="tuft-grass" d="M30,560 l2,-6 l2,5 l2,-7 l2,7"/>
        <path class="tuft-grass" d="M362,566 l2,-6 l2,5 l2,-7 l2,7"/>
        <path class="tuft-grass" d="M108,628 l2,-6 l2,5 l2,-7 l2,7"/>
        <path class="tuft-grass" d="M286,624 l2,-6 l2,5 l2,-7 l2,7"/>
        <path class="tuft-grass" d="M196,664 l2,-6 l2,5 l2,-7 l2,7"/>
        <path class="tuft-grass" d="M54,676 l2,-6 l2,5 l2,-7 l2,7"/>
        <path class="tuft-grass" d="M338,680 l2,-6 l2,5 l2,-7 l2,7"/>
      </g>

      <!-- five friends -->
      <g id="crew"></g>
    </svg>

    <p class="sr">A short cartoon: five friends in graduation gowns throw their caps into the evening sky. The caps turn into stars and join up into one big star, and the friends link arms under it.</p>

    <div class="words" aria-live="polite">
      <div class="captions">
        <p class="caption c1" id="cap1"></p>
        <p class="caption c2" id="cap2"></p>
      </div>
      <div class="final">
        <h1 class="greet" id="greet"></h1>
        <p class="note" id="note"></p>
        <p class="sign" id="sign"></p>
        <button class="again" id="again" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
          Watch again
        </button>
      </div>
    </div>
  </div>

  <button class="sound" id="sound" type="button" aria-pressed="true" aria-label="Music" hidden>
    <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>
    <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M17 9l5 6M22 9l-5 6"/></svg>
  </button>

  <div class="intro" id="intro">
    <p class="for" id="forName">For you</p>
    <button class="envelope" id="envelope" type="button" aria-label="Open your card">
      <svg viewBox="0 -44 248 214" aria-hidden="true">
        <rect x="4" y="30" width="240" height="136" rx="6" fill="#efe3d4"/>
        <g transform="translate(0,30)">
          <g class="flap-back">
            <path d="M4,0 L124,72 L244,0 Z" fill="#f4eadf" stroke="#e6d9c8" stroke-width="1.2" stroke-linejoin="round"/>
          </g>
        </g>
        <g class="letter">
          <rect x="26" y="42" width="196" height="110" rx="3" fill="#ffffff"/>
          <g transform="translate(124,55)">
            <path d="M-12,-1 L-12,4 Q0,9 12,4 L12,-1 Z" fill="#23264d"/>
            <path d="M-20,-3 L0,-9 L20,-3 L0,3 Z" fill="#2f3468"/>
            <path d="M0,-3 Q8,-4 14,-1.5 L14.5,6" fill="none" stroke="#f5c04a" stroke-width="1.3"/>
          </g>
          <text id="classOf" x="124" y="80" text-anchor="middle" font-size="13" font-weight="600" fill="#3b3f88" style="font-family: var(--font)">Class of 2026</text>
        </g>
        <path d="M4,30 L124,100 L244,30 L244,160 Q244,166 238,166 L10,166 Q4,166 4,160 Z" fill="#fffaf3"/>
        <path d="M6,164 L124,110 L242,164" fill="none" stroke="#ece1d2" stroke-width="1.4"/>
        <path d="M7.5,40 V162.5 H240.5 V40" fill="none" stroke="#e5566a" stroke-width="5" stroke-dasharray="9 9"/>
        <path d="M7.5,40 V162.5 H240.5 V40" fill="none" stroke="#3b5ba9" stroke-width="5" stroke-dasharray="9 9" stroke-dashoffset="9"/>
        <g transform="translate(0,30)">
          <g class="flap-front">
            <path d="M4,0 L124,74 L244,0 Z" fill="#fff6ec" stroke="#eadfd0" stroke-width="1.2" stroke-linejoin="round"/>
            <path d="M12,3.5 H236" stroke="#e5566a" stroke-width="5" stroke-dasharray="9 9"/>
            <path d="M12,3.5 H236" stroke="#3b5ba9" stroke-width="5" stroke-dasharray="9 9" stroke-dashoffset="9"/>
          </g>
        </g>
        <g transform="translate(124,104)">
          <g class="seal-pulse">
            <circle r="18" fill="#d94a5e"/>
            <circle r="13.5" fill="none" stroke="#b83347" stroke-width="1.5"/>
            <path d="M-9,-1 L0,-4.5 L9,-1 L0,2.5 Z" fill="#ffd9de"/>
            <path d="M-5.5,1 L-5.5,4 Q0,7 5.5,4 L5.5,1" fill="#ffd9de"/>
          </g>
        </g>
      </svg>
    </button>
    <p class="hint">Tap to open<small>Best with sound on</small></p>
  </div>
</div>

<audio id="music" src="music.mp3" preload="auto"></audio>

<script>
(function () {
  "use strict";
  var NS = "http://www.w3.org/2000/svg";
  var C = window.CARD || {};

  /* ---------- personal touches ---------- */
  var params = new URLSearchParams(location.search);
  var NAMES = window.NAMES || {};
  var code = (params.get("c") || "").trim().toLowerCase();
  var fromCode = Object.prototype.hasOwnProperty.call(NAMES, code) ? String(NAMES[code] || "") : "";
  var name = ((params.get("to") || "").trim() || fromCode.trim()).slice(0, 30);
  document.getElementById("forName").textContent = name ? "For " + name : "For you";
  document.getElementById("greet").textContent = name
    ? (C.greeting || "Happy graduation, {name}!").replace("{name}", name)
    : (C.greetingNoName || "Happy graduation!");
  document.getElementById("cap1").textContent = C.caption1 || "";
  document.getElementById("cap2").textContent = C.caption2 || "";
  document.getElementById("note").textContent = C.note || "";
  document.getElementById("sign").textContent = C.from ? "— " + C.from : "";
  document.getElementById("classOf").textContent = C.classOf ? "Class of " + C.classOf : "";
  if (name) document.title = "For " + name;

  /* ---------- tiny helpers ---------- */
  function el(tag, attrs, parent) {
    var n = document.createElementNS(NS, tag);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  }
  function rand(seed) {            // deterministic, so the sky looks the same every time
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  /* ---------- the five stars (a pentagon; the lines draw a star through them) ---------- */
  var STARS = [];
  for (var k = 0; k < 5; k++) {
    var a = (-90 + 72 * k) * Math.PI / 180;
    STARS.push({ x: 200 + 82 * Math.cos(a), y: 170 + 82 * Math.sin(a) });
  }

  /* ---------- five friends ---------- */
  var CREW = [
    { x: 80,  color: "#ffc2a8", shade: "#ee9a80", tuft: "curl",   star: 4, mx: -24, rot: -720, dur: 2.08 },
    { x: 140, color: "#a9e5c9", shade: "#79c8a5", tuft: "none",   star: 3, mx: -30, rot: -360, dur: 2.22, glasses: true },
    { x: 200, color: "#cdb8f2", shade: "#a68edc", tuft: "spikes", star: 0, mx: 0,   rot: 720,  dur: 1.95 },
    { x: 260, color: "#ffe29a", shade: "#ecc161", tuft: "sprout", star: 2, mx: 30,  rot: 360,  dur: 2.28 },
    { x: 320, color: "#a8d7f5", shade: "#76b7e2", tuft: "curl2",  star: 1, mx: 24,  rot: 720,  dur: 2.14 }
  ];
  var INK = "#2a2342", GOWN = "#2d3266";
  var BODY = "M-25,0 C-27.5,-30 -20,-58 0,-58 C20,-58 27.5,-30 25,0 Q0,3 -25,0 Z";

  /* chapel */
  (function buildChapel() {
    var g = document.getElementById("chapel");
    el("rect", { "class": "sil", x: 124, y: 430, width: 152, height: 46 }, g);
    [120, 280].forEach(function (cx) {
      el("rect", { "class": "sil", x: cx - 6, y: 396, width: 12, height: 80 }, g);
      el("rect", { "class": "sil", x: cx - 7.5, y: 392, width: 15, height: 5 }, g);
      el("path", { "class": "sil", d: "M" + (cx - 5) + ",392 L" + cx + ",374 L" + (cx + 5) + ",392 Z" }, g);
      el("circle", { "class": "sil", cx: cx, cy: 373, r: 1.4 }, g);
    });
    for (var i = 0; i < 9; i++) {
      var px = 138 + i * 15.5;
      el("rect", { "class": "sil", x: px - 1.4, y: 419, width: 2.8, height: 12 }, g);
      el("path", { "class": "sil", d: "M" + (px - 2.2) + ",420 L" + px + ",412 L" + (px + 2.2) + ",420 Z" }, g);
      if (i < 8) {
        var wx = px + 7.75;
        var w = el("path", { "class": "win", d: "M" + (wx - 4) + ",470 V442 A4,4 0 0 1 " + (wx + 4) + ",442 V470 Z", fill: "#ffd98a" }, g);
        w.style.setProperty("--d", (0.15 * ((i * 5) % 8)).toFixed(2) + "s");
      }
    }
    el("rect", { "class": "sil", x: 286, y: 450, width: 62, height: 26 }, g);
    el("path", { "class": "sil", d: "M303,450 L317,440 L331,450 Z" }, g);
    [296, 312, 322, 338].forEach(function (x, j) {
      var w = el("rect", { "class": "win", x: x - 2.5, y: 457, width: 5, height: 8, rx: 1, fill: "#ffd98a" }, g);
      w.style.setProperty("--d", (0.3 + j * 0.2).toFixed(2) + "s");
    });
  })();

  /* background stars */
  (function buildSky() {
    var g = document.getElementById("bgStars"), r = rand(42), placed = 0, tries = 0;
    while (placed < 46 && tries < 500) {
      tries++;
      var x = 8 + r() * 384, y = 12 + r() * 420;
      var near = STARS.some(function (s) { return Math.hypot(s.x - x, s.y - y) < 22; }) || Math.hypot(66 - x, 104 - y) < 32;
      if (near) continue;
      var c = el("circle", { "class": "bgs", cx: x.toFixed(1), cy: y.toFixed(1), r: (0.5 + r() * 1.1).toFixed(2), fill: "#fff" }, g);
      c.style.setProperty("--d", (r() * 1.4).toFixed(2) + "s");
      c.style.setProperty("--p", (2 + r() * 3).toFixed(2) + "s");
      placed++;
    }
  })();

  /* constellation stars + lines */
  (function buildStars() {
    var g = document.getElementById("stars"), defs = document.querySelector("#scene defs");
    STARS.forEach(function (s, i) {
      var owner = CREW.filter(function (c) { return c.star === i; })[0];
      var grad = el("radialGradient", { id: "halo" + i }, defs);
      el("stop", { offset: "0", "stop-color": owner.color, "stop-opacity": ".75" }, grad);
      el("stop", { offset: "1", "stop-color": owner.color, "stop-opacity": "0" }, grad);
      var at = el("g", { id: "s" + i, transform: "translate(" + s.x.toFixed(1) + "," + s.y.toFixed(1) + ")" }, g);
      var burst = el("g", { "class": "burst" }, at);
      for (var j = 0; j < 4; j++) {
        var ang = (45 + 90 * j) * Math.PI / 180;
        el("line", {
          x1: (11 * Math.cos(ang)).toFixed(1), y1: (11 * Math.sin(ang)).toFixed(1),
          x2: (17 * Math.cos(ang)).toFixed(1), y2: (17 * Math.sin(ang)).toFixed(1),
          stroke: "#fff4d6", "stroke-width": 1.5, "stroke-linecap": "round"
        }, burst);
      }
      var star = el("g", { "class": "star" }, at);
      el("circle", { r: 18, fill: "url(#halo" + i + ")" }, star);
      el("path", { d: "M0,-10 C1,-2.5 2.5,-1 10,0 C2.5,1 1,2.5 0,10 C-1,2.5 -2.5,1 -10,0 C-2.5,-1 -1,-2.5 0,-10 Z", fill: "#fff4d6" }, star);
      el("circle", { r: 2.2, fill: "#fff" }, star);
    });
    var order = [0, 2, 4, 1, 3, 0];
    var d = order.map(function (k, n) { return (n ? "L" : "M") + STARS[k].x.toFixed(1) + "," + STARS[k].y.toFixed(1); }).join(" ");
    document.getElementById("lines").setAttribute("d", d);
  })();

  /* the friends */
  function tuftPath(kind, shade) {
    switch (kind) {
      case "curl": return { d: "M-2,-56 C-6,-66 4,-71 5,-64.5 C6,-60 1,-59 0,-62", stroke: shade, "stroke-width": 2.6, fill: "none", "stroke-linecap": "round" };
      case "curl2": return { d: "M2,-56 C6,-66 -4,-71 -5,-64.5 C-6,-60 -1,-59 0,-62", stroke: shade, "stroke-width": 2.6, fill: "none", "stroke-linecap": "round" };
      case "spikes": return { d: "M-8,-55 L-6,-64 L-1.5,-57 L1,-67 L4,-57 L7.5,-63 L8,-55 Z", fill: shade, "stroke-linejoin": "round" };
      default: return null;
    }
  }
  (function buildCrew() {
    var root = document.getElementById("crew");
    CREW.forEach(function (c, i) {
      var g = el("g", { id: "c" + i, transform: "translate(" + c.x + ",600)" }, root);
      el("ellipse", { "class": "cshadow", cx: 0, cy: 1, rx: 22, ry: 4.5, fill: "#16302b", opacity: ".22", style: "--i:" + i }, g);
      var pop = el("g", { "class": "pop", style: "--i:" + i }, g);
      var sway = el("g", { "class": "sway" }, pop);
      var jump = el("g", { "class": "jump" }, sway);

      [-1, 1].forEach(function (side) {
        var at = el("g", { transform: "translate(" + (21 * side) + ",-24)" }, jump);
        var outer = (side === -1 && i === 0) || (side === 1 && i === CREW.length - 1);
        var arm = el("g", { "class": (side === -1 ? "arm-l" : "arm-r") + (outer ? " outer" : "") }, at);
        var wave = el("g", { "class": "wave" }, arm);
        el("line", { x1: 0, y1: 0, x2: 0, y2: 10, stroke: GOWN, "stroke-width": 5.5, "stroke-linecap": "round" }, wave);
        el("circle", { cx: 0, cy: 12, r: 3.3, fill: c.color }, wave);
      });

      var t = tuftPath(c.tuft, c.shade);
      if (t) el("path", t, jump);
      if (c.tuft === "sprout") {
        el("path", { d: "M0,-57 L0,-64", stroke: "#5fa35b", "stroke-width": 2, "stroke-linecap": "round" }, jump);
        el("path", { d: "M0,-63 C-7,-70 -11,-63 -1,-62 Z", fill: "#79c473" }, jump);
        el("path", { d: "M0,-64 C6,-72 11,-65 1,-63 Z", fill: "#79c473" }, jump);
      }

      el("path", { d: BODY, fill: c.color }, jump);
      el("rect", { x: -30, y: -30, width: 60, height: 34, fill: GOWN, "clip-path": "url(#bodyClip)" }, jump);
      el("path", { d: "M-8,-30.5 L0,-21 L8,-30.5 Z", fill: c.color }, jump);
      el("path", { d: "M-8.5,-30 L0,-20.5 L8.5,-30", fill: "none", stroke: "#f4eee6", "stroke-width": 2.2, "stroke-linecap": "round", "stroke-linejoin": "round" }, jump);

      var eyes = el("g", { "class": "eyes" }, jump);
      var open = el("g", { "class": "eyes-open" }, eyes);
      [-8.5, 8.5].forEach(function (ex) {
        el("circle", { cx: ex, cy: -41, r: 2.7, fill: INK }, open);
        el("circle", { cx: ex + 0.9, cy: -42, r: 0.9, fill: "#fff" }, open);
      });
      var happy = el("g", { "class": "eyes-happy", fill: "none", stroke: INK, "stroke-width": 1.8, "stroke-linecap": "round" }, jump);
      el("path", { d: "M-11.5,-40 Q-8.5,-44.5 -5.5,-40" }, happy);
      el("path", { d: "M5.5,-40 Q8.5,-44.5 11.5,-40" }, happy);
      if (c.glasses) {
        var gl = el("g", { fill: "rgba(255,255,255,.18)", stroke: INK, "stroke-width": 1.3 }, jump);
        el("circle", { cx: -8.5, cy: -41.5, r: 5.4 }, gl);
        el("circle", { cx: 8.5, cy: -41.5, r: 5.4 }, gl);
        el("path", { d: "M-3.1,-42 Q0,-44 3.1,-42", fill: "none" }, gl);
      }
      el("ellipse", { cx: -15, cy: -35.5, rx: 4.2, ry: 2.4, fill: "#ff8fa3", opacity: ".5" }, jump);
      el("ellipse", { cx: 15, cy: -35.5, rx: 4.2, ry: 2.4, fill: "#ff8fa3", opacity: ".5" }, jump);
      el("path", { "class": "mouth-smile", d: "M-3.5,-35.5 Q0,-32 3.5,-35.5", fill: "none", stroke: INK, "stroke-width": 1.7, "stroke-linecap": "round" }, jump);
      el("path", { "class": "mouth-open", d: "M-4,-36 Q0,-29 4,-36 Z", fill: "#7a2e43", stroke: INK, "stroke-width": 1.2, "stroke-linejoin": "round" }, jump);

      /* the cap lives outside the jumping body so it can fly away on its own path */
      var dip = el("g", { "class": "cap-dip" }, pop);
      var cx = el("g", { "class": "cap-x" }, dip);
      var cy = el("g", { "class": "cap-y" }, cx);
      var seat = el("g", { transform: "translate(0,-60)" }, cy);
      var spin = el("g", { "class": "cap-spin" }, seat);
      el("path", { d: "M-12,-1 L-12,5 Q0,10 12,5 L12,-1 Z", fill: "#23264d" }, spin);
      el("path", { d: "M-21,-3 L0,-9.5 L21,-3 L0,3.5 Z", fill: "#2f3468", stroke: "#454b8c", "stroke-width": 0.8, "stroke-linejoin": "round" }, spin);
      el("circle", { cx: 0, cy: -3, r: 1.5, fill: "#f5c04a" }, spin);
      el("path", { d: "M0,-3 Q9,-4 15,-1.5 L15.5,6", fill: "none", stroke: "#f5c04a", "stroke-width": 1.3, "stroke-linecap": "round" }, spin);
      el("ellipse", { cx: 15.5, cy: 8.5, rx: 1.8, ry: 3, fill: "#f5c04a" }, spin);
    });
  })();

  /* per-cap flight paths and star timings, written as CSS so the browser runs them smoothly */
  (function buildTimeline() {
    var css = "";
    CREW.forEach(function (c, i) {
      var s = STARS[c.star];
      var ex = (s.x - c.x).toFixed(1), ey = (s.y - 547).toFixed(1);
      var start = 2.6, end = start + c.dur;
      css += "@keyframes capX" + i + "{0%{transform:translateX(0);animation-timing-function:cubic-bezier(.3,.6,.5,1)}45%{transform:translateX(" + c.mx + "px);animation-timing-function:cubic-bezier(.5,0,.4,1)}100%{transform:translateX(" + ex + "px)}}";
      css += "@keyframes capY" + i + "{to{transform:translateY(" + ey + "px)}}";
      css += "@keyframes capSpin" + i + "{to{transform:rotate(" + c.rot + "deg) scale(.5)}}";
      css += ".go #c" + i + " .cap-x{animation:capX" + i + " " + c.dur + "s " + start + "s both}";
      css += ".go #c" + i + " .cap-y{animation:capY" + i + " " + c.dur + "s " + start + "s cubic-bezier(.12,.72,.32,1) both,fadeOut .3s " + (end - 0.22).toFixed(2) + "s forwards}";
      css += ".go #c" + i + " .cap-spin{animation:capSpin" + i + " " + c.dur + "s " + start + "s cubic-bezier(.25,.6,.35,1) both}";
      css += ".go #s" + c.star + " .star{animation:starPop .65s " + (end - 0.1).toFixed(2) + "s cubic-bezier(.3,1.7,.5,1) both,starTwinkle " + (2.2 + i * 0.3).toFixed(1) + "s " + (end + 0.9).toFixed(2) + "s ease-in-out infinite}";
      css += ".go #s" + c.star + " .burst{animation:burst .8s " + (end - 0.08).toFixed(2) + "s ease-out both}";
    });
    var lines = document.getElementById("lines");
    var len = Math.ceil(lines.getTotalLength());
    lines.style.strokeDasharray = len;
    lines.style.strokeDashoffset = len;
    css += "@keyframes drawLines{from{stroke-dashoffset:" + len + "}to{stroke-dashoffset:0}}";
    css += ".go .lines{animation:drawLines 1.7s 5.3s ease-in-out both}";
    var style = document.createElement("style");
    style.textContent = css;
    document.head.appendChild(style);
  })();

  /* ---------- fit the 400 x 700 drawing to any screen (cover) ---------- */
  var frame = document.getElementById("frame"), stage = document.getElementById("stage");
  function fit() {
    var w = frame.clientWidth, h = frame.clientHeight;
    var s = Math.max(w / 400, h / 700);
    stage.style.transform = "translate(-50%,-50%) scale(" + s + ")";
  }
  fit();
  window.addEventListener("resize", fit);
  if (window.visualViewport) window.visualViewport.addEventListener("resize", fit);

  /* ---------- playing ---------- */
  var audio = document.getElementById("music");
  var soundBtn = document.getElementById("sound");
  var intro = document.getElementById("intro");
  var soundOn = true, audioOK = true, opened = false;
  var MUSIC_OFFSET = 0.7;   // the tune starts with the envelope; the cartoon starts 0.7 s later

  audio.addEventListener("error", function () { audioOK = false; soundBtn.hidden = true; });

  function play() {
    frame.classList.remove("go");
    void stage.getBoundingClientRect();
    frame.classList.add("go");
  }

  function open() {
    if (opened) return;
    opened = true;
    intro.classList.add("opening");
    var started = false;
    function kick(delayMs) {
      if (started) return;
      started = true;
      setTimeout(play, Math.max(0, delayMs));
    }
    if (audioOK) {
      try { audio.currentTime = 0; } catch (e) {}
      audio.addEventListener("playing", function () {
        kick(MUSIC_OFFSET * 1000 - audio.currentTime * 1000);
      }, { once: true });
      var p = audio.play();
      if (p && p.catch) p.catch(function () { audioOK = false; soundBtn.hidden = true; kick(MUSIC_OFFSET * 1000); });
      soundBtn.hidden = false;
    }
    setTimeout(function () { kick(0); }, 950);   // never keep anyone waiting on the music
    setTimeout(function () { intro.hidden = true; }, 1050);
  }

  document.getElementById("envelope").addEventListener("click", open);

  document.getElementById("again").addEventListener("click", function () {
    play();
    if (audioOK) {
      try { audio.currentTime = MUSIC_OFFSET; } catch (e) {}
      var p = audio.play();
      if (p && p.catch) p.catch(function () {});
    }
  });

  soundBtn.addEventListener("click", function () {
    soundOn = !soundOn;
    audio.muted = !soundOn;
    soundBtn.setAttribute("aria-pressed", String(soundOn));
    soundBtn.setAttribute("aria-label", soundOn ? "Music on" : "Music off");
  });
})();
</script>
</body>
</html>
